<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - SellBookWeb</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/customer-styles.css">
    <style>
        .checkout-container {
            max-width: 800px;
            margin: 100px auto;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .checkout-section {
            margin-bottom: 2rem;
        }
        .checkout-section h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        .cart-summary {
            background: #f7fafc;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .payment-methods {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .payment-method {
            flex: 1;
            min-width: 150px;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .payment-method:hover,
        .payment-method.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .payment-method input {
            display: none;
        }
        .payment-method-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .total-section {
            background: #667eea;
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            margin-top: 2rem;
        }
        .total-section h3 {
            font-size: 1.5rem;
            margin: 0;
        }
        .btn-place-order {
            width: 100%;
            margin-top: 1rem;
        }
        .coupon-buttons-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: stretch;
        }
        .coupon-btn {
            border: 2px solid #e2e8f0;
            background: #fff;
            border-radius: 10px;
            padding: 0.65rem 1rem;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s, background 0.2s;
            min-width: 140px;
            flex: 1 1 auto;
        }
        .coupon-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .coupon-btn.selected {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 0 0 1px #667eea;
        }
        .coupon-btn .code {
            font-weight: 700;
            color: #667eea;
            font-size: 1rem;
        }
        .coupon-btn .meta {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 0.25rem;
        }
        .coupon-btn-none {
            border-style: dashed;
        }
    </style>
</head>
<body class="app-layout">
    <nav class="navbar">
        <div class="nav-brand">📚 SellBookWeb</div>
        <div class="nav-links">
            <a href="customer.html">Tiếp tục mua sắm</a>
        </div>
    </nav>

    <div class="checkout-container">
        <h1 style="margin-bottom: 2rem; color: #667eea;">🛒 Thanh toán</h1>

        <div class="checkout-section">
            <h2>Giỏ hàng của bạn</h2>
            <div id="cartItems" class="cart-summary"></div>
        </div>

        <div class="checkout-section">
            <h2>Thông tin giao hàng</h2>
            <div class="form-group">
                <label>Họ tên người nhận:</label>
                <input type="text" id="receiverName" required>
            </div>
            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="tel" id="receiverPhone" required pattern="[0-9]{10}">
            </div>
            <div class="form-group">
                <label>Địa chỉ giao hàng:</label>
                <textarea id="shippingAddress" rows="3" required placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"></textarea>
            </div>
        </div>

        <div class="checkout-section">
            <h2>Mã giảm giá</h2>
            <p id="couponLoading" style="color:#64748b; font-size:0.9rem;">Đang tải mã khả dụng...</p>
            <div id="couponButtons" class="coupon-buttons-wrap" style="display:none;"></div>
            <p id="couponHint" style="color:#666; font-size:0.9rem; margin-top:0.75rem;"></p>
        </div>

        <div class="checkout-section">
            <h2>Phương thức thanh toán</h2>
            <div class="payment-methods">
                <label class="payment-method selected" onclick="selectPayment(this, 'COD')">
                    <input type="radio" name="paymentMethod" value="COD" checked>
                    <div class="payment-method-icon">💵</div>
                    <div>Thanh toán khi nhận hàng (COD)</div>
                </label>
                <label class="payment-method" onclick="selectPayment(this, 'CARD')">
                    <input type="radio" name="paymentMethod" value="CARD">
                    <div class="payment-method-icon">💳</div>
                    <div>Thẻ tín dụng/Debit</div>
                </label>
                <label class="payment-method" onclick="selectPayment(this, 'TRANSFER')">
                    <input type="radio" name="paymentMethod" value="TRANSFER">
                    <div class="payment-method-icon">🏦</div>
                    <div>Chuyển khoản ngân hàng</div>
                </label>
            </div>
        </div>

        <div class="total-section">
            <p>Tạm tính: <span id="subtotalAmount">0 ₫</span></p>
            <p id="couponDiscountRow" style="display:none; font-size:0.95rem;">Giảm coupon: <span id="couponDiscountAmount">0 ₫</span></p>
            <p>Tổng thanh toán</p>
            <h3 id="totalAmount">0 ₫</h3>
            <button class="submit-btn btn-place-order" onclick="placeOrder()">Đặt hàng</button>
        </div>
    </div>

    <script src="../js/constants.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/checkout.js"></script>
</body>
</html>
